# Определяем этапы (стадии) пайплайна
stages:
  - test

# Название задачи (job)
run_tests:
  stage: test
  # Используем официальный Docker-образ с Python.
  # Укажите вашу версию (например, 3.12 или 3.13)
  image: python:3.12-slim

  # Команды, которые нужно выполнить
  script:
    - echo "Устанавливаем зависимости..."
    - pip install --no-cache-dir -r requirements.txt
    - echo "Запускаем тесты..."
    - pytest

  # Ограничиваем запуск: только при событиях push (коммит в репозиторий)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'